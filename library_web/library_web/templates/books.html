{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h1>Books</h1>
    <a class="btn btn-primary" href="/books/add">+ Add a book</a>
</div>
<form method="get" action="/books" class="d-flex gap-2 mb-3">
    <input class="form-control" name="q" value="{{ q|default('') }}" placeholder="Search title or author">
    <button class="btn btn-outline-primary" type="submit">Search</button>
</form>
<table class="table table-striped table-hover">
    <thead>
        <tr><th>Title</th><th>Author</th><th>Year</th></tr>
    </thead>
    <tbody>
        {% for b in books %}
        <tr>
            <td><a href="/books/{{ b.id }}">{{ b.title }}</a></td>
            <td>{{ b.author }}</td>
            <td>{{ b.year }}</td>
        </tr>
        {% else %}
        <tr><td colspan="3">No books found.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
